<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-label="Bus an einer roten Ampel auf einer weiten Wiese mit Hasen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7290a1"/><stop offset=".48" stop-color="#e7bc71"/><stop offset="1" stop-color="#f2c76f"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b7436"/><stop offset=".42" stop-color="#655f27"/><stop offset="1" stop-color="#27280f"/></linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#292d2f"/><stop offset="1" stop-color="#090b0c"/></linearGradient>
    <radialGradient id="sun" cx="18%" cy="38%" r="50%"><stop offset="0" stop-color="#fff0ba" stop-opacity=".8"/><stop offset="1" stop-color="#fff0ba" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grassPattern" width="30" height="36" patternUnits="userSpaceOnUse"><path d="M4 35l4-17M12 35l-1-13M21 35l5-20M28 35l-2-11" stroke="#a69445" stroke-width="1.2" opacity=".5"/><circle cx="8" cy="17" r="1.3" fill="#d9a94b" opacity=".8"/><circle cx="24" cy="23" r="1" fill="#e8d38c" opacity=".65"/></pattern>
  </defs>
  <rect width="900" height="590" fill="url(#sky)"/>
  <rect width="900" height="590" fill="url(#sun)"/>
  <g opacity=".72" fill="#f4d8a0" filter="url(#soft)">
    <ellipse cx="130" cy="210" rx="105" ry="54"/><ellipse cx="210" cy="180" rx="88" ry="70"/><ellipse cx="290" cy="225" rx="120" ry="48"/>
    <ellipse cx="615" cy="185" rx="110" ry="55"/><ellipse cx="735" cy="150" rx="92" ry="66"/><ellipse cx="795" cy="225" rx="120" ry="52"/>
  </g>
  <path d="M0 570c130-26 250-10 360 4 160 20 308-30 540-4v75H0z" fill="#55562d"/>
  <rect y="590" width="900" height="410" fill="url(#grass)"/>
  <rect y="590" width="900" height="410" fill="url(#grassPattern)" opacity=".9"/>

  <!-- traffic light -->
  <g transform="translate(270 340)">
    <rect x="20" y="52" width="12" height="305" rx="4" fill="#242526"/>
    <rect x="0" y="0" width="52" height="132" rx="9" fill="#151718" stroke="#313435" stroke-width="3"/>
    <circle cx="26" cy="25" r="16" fill="#d31515" filter="url(#glow)"/><circle cx="26" cy="25" r="8" fill="#ff4a35"/>
    <circle cx="26" cy="66" r="15" fill="#32270e"/><circle cx="26" cy="107" r="15" fill="#111b13"/>
    <rect x="11" y="220" width="31" height="39" rx="3" fill="#60605b"/>
  </g>

  <!-- bus -->
  <g transform="translate(380 540)">
    <path d="M0 84c0-44 18-70 52-76h270c45 0 81 25 93 64l11 116c2 24-15 44-39 44H38c-25 0-38-17-38-42z" fill="url(#bus)" stroke="#4a4c4c" stroke-width="3"/>
    <path d="M28 80c4-31 17-47 39-52h206c30 0 52 13 67 39l-3 42H25z" fill="#20282b"/>
    <g fill="#53616a" stroke="#101416" stroke-width="3">
      <path d="M42 42h70v65H30l7-43z"/><rect x="116" y="42" width="52" height="65"/><rect x="172" y="42" width="52" height="65"/><rect x="228" y="42" width="52" height="65"/><rect x="284" y="48" width="50" height="59"/>
    </g>
    <rect x="75" y="13" width="160" height="26" rx="6" fill="#090909" stroke="#444"/>
    <text x="155" y="31" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#ff7a00">BACHELORTOUR 2026</text>
    <path d="M255 153c39-17 72-12 113 2" fill="none" stroke="#f27600" stroke-width="5" stroke-linecap="round"/>
    <text x="310" y="148" font-family="cursive" font-size="25" font-weight="700" fill="#f27600" transform="rotate(-6 310 148)">Firestarter</text>
    <rect x="15" y="125" width="67" height="58" rx="5" fill="#111619" stroke="#4e5558"/>
    <circle cx="30" cy="169" r="8" fill="#e9d9b2"/><circle cx="60" cy="169" r="8" fill="#e9d9b2"/>
    <circle cx="92" cy="226" r="37" fill="#080909" stroke="#3f4141" stroke-width="7"/><circle cx="92" cy="226" r="16" fill="#292c2d"/>
    <circle cx="345" cy="226" r="37" fill="#080909" stroke="#3f4141" stroke-width="7"/><circle cx="345" cy="226" r="16" fill="#292c2d"/>
    <rect x="84" y="190" width="55" height="20" rx="3" fill="#c9c9b9"/><text x="111" y="205" text-anchor="middle" font-family="Arial" font-size="12" fill="#111">FS 26</text>
  </g>

  <!-- rabbits -->
  <g fill="#3a2817" stroke="#1d150e" stroke-width="2">
    <g transform="translate(125 785) scale(1.3)"><ellipse cx="30" cy="30" rx="24" ry="30"/><circle cx="49" cy="14" r="14"/><ellipse cx="48" cy="-7" rx="5" ry="18" transform="rotate(-9 48 -7)"/><ellipse cx="59" cy="-4" rx="5" ry="18" transform="rotate(12 59 -4)"/><circle cx="55" cy="11" r="2" fill="#d7aa69"/><circle cx="8" cy="43" r="9" fill="#d8d0b4"/></g>
    <g transform="translate(760 750) rotate(-8)"><ellipse cx="0" cy="20" rx="24" ry="15"/><circle cx="25" cy="11" r="10"/><ellipse cx="29" cy="-5" rx="4" ry="14"/><path d="M-20 25l-22 16M-5 31l-10 23M12 31l23 14" fill="none" stroke="#3a2817" stroke-width="6" stroke-linecap="round"/></g>
    <g transform="translate(150 650) scale(.55)"><ellipse cx="0" cy="15" rx="25" ry="16"/><circle cx="24" cy="4" r="11"/><ellipse cx="29" cy="-11" rx="4" ry="15"/></g>
    <g transform="translate(95 610) scale(.35)"><ellipse cx="0" cy="15" rx="25" ry="16"/><circle cx="24" cy="4" r="11"/><ellipse cx="29" cy="-11" rx="4" ry="15"/></g>
  </g>
  <rect x="1.5" y="1.5" width="897" height="997" rx="26" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/>
</svg>